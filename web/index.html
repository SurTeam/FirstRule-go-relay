<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FirstRule Relay Client</title>
<style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --card: #243044;
  --text: #e7ecf3;
  --dim: #9aa7b8;
  --accent: #3d8bfd;
  --ok: #3dd68c;
  --err: #ff6b6b;
  --border: #2c3a4f;
  --user: #1e3a5f;
  --agent: #1f3d2f;
  --sys: #2a2f3a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; min-height: 100dvh; }
header, footer { padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
footer { border-bottom: 0; border-top: 1px solid var(--border); }
h1 { margin: 0; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input, button, select, textarea { font: inherit; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 10px; }
input, select, textarea { flex: 1; min-width: 0; }
button { background: var(--accent); border: none; color: white; cursor: pointer; white-space: nowrap; }
button.secondary { background: #334155; }
button.danger { background: var(--err); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
#setup { padding: 12px; display: grid; gap: 8px; }
#app { display: none; flex: 1; flex-direction: column; min-height: 0; }
#statusBar { padding: 8px 12px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); }
#main { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
@media (min-width: 900px) { #main { grid-template-columns: 1fr 280px; } }
#listView, #chatView { display: none; flex: 1; flex-direction: column; min-height: 0; }
#listView.active, #chatView.active { display: flex; }
#sessionList { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.session-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--card);
  cursor: pointer; display: grid; gap: 4px;
}
.session-card:hover { border-color: var(--accent); }
.session-card.primary { outline: 1px solid var(--accent); }
.session-card .title { font-weight: 600; }
.session-card .meta { color: var(--dim); font-size: 12px; }
#transcript { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: var(--user); }
.msg.agent { background: var(--agent); }
.msg.system, .msg.tool, .msg.think { background: var(--sys); color: var(--dim); }
.msg .meta { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
#side { border-left: 1px solid var(--border); background: var(--panel); padding: 12px; overflow: auto; }
#side h2 { margin: 0 0 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; }
.perm { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--card); }
.composer { display: grid; gap: 8px; }
#composer { min-height: 64px; resize: vertical; }
.ok { color: var(--ok); }
.err { color: var(--err); }
.hidden { display: none !important; }
.toolbar { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
</style>
</head>
<body>
<header>
  <div class="row" style="justify-content: space-between;">
    <h1>FirstRule Relay Client</h1>
    <div class="row">
      <button id="btnDisconnect" class="secondary hidden" type="button">Disconnect</button>
    </div>
  </div>
</header>

<section id="setup">
  <p style="margin:0;color:var(--dim)">Connect with the same relay origin and connect token used by the desktop daemon. Traffic goes to <code>/c/&lt;token&gt;/…</code>.</p>
  <div class="row">
    <input id="relayURL" placeholder="https://your-relay.example.workers.dev" autocomplete="off" />
  </div>
  <div class="row">
    <input id="token" placeholder="connect token" autocomplete="off" spellcheck="false" />
    <button id="btnConnect" type="button">Connect</button>
  </div>
  <div id="setupError" class="err"></div>
</section>

<section id="app">
  <div id="statusBar">Disconnected</div>

  <div id="listView">
    <div class="toolbar row" style="justify-content: space-between;">
      <strong>Sessions</strong>
      <button id="btnRefreshList" class="secondary" type="button">Refresh</button>
    </div>
    <div id="sessionList"></div>
  </div>

  <div id="chatView">
    <div class="toolbar row" style="justify-content: space-between;">
      <div class="row">
        <button id="btnBackList" class="secondary" type="button">← Sessions</button>
        <span id="chatTitle" style="color:var(--dim)"></span>
      </div>
      <button id="btnRefreshSession" class="secondary" type="button">Refresh</button>
    </div>
    <div id="main">
      <div id="transcript"></div>
      <aside id="side">
        <h2>Session</h2>
        <pre id="sessionInfo" style="white-space:pre-wrap;color:var(--dim);margin:0 0 16px"></pre>
        <h2>Permissions</h2>
        <div id="permissions"><div class="dim">none pending</div></div>
        <div class="row" style="margin-top:12px">
          <button id="btnRefreshPerms" class="secondary" type="button">Refresh</button>
        </div>
      </aside>
    </div>
    <footer>
      <div class="composer">
        <textarea id="composer" placeholder="Message the agent…"></textarea>
        <div class="row">
          <button id="btnSend" type="button">Send</button>
          <button id="btnClear" class="secondary" type="button">Clear log</button>
        </div>
      </div>
    </footer>
  </div>
</section>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
const state = {
    base: "",
    es: null,
    busy: false,
    view: "list", // list | chat
    primaryId: "",
    agents: [],
    selectedId: "",
    stream: { asst: null, think: null, tools: {} },
  };

  function saveCreds() {
    try {
      localStorage.setItem("firstrule.relayURL", $("relayURL").value.trim());
      localStorage.setItem("firstrule.token", $("token").value.trim());
    } catch (_) {}
  }
  function loadCreds() {
    try {
      $("relayURL").value = localStorage.getItem("firstrule.relayURL") || "";
      $("token").value = localStorage.getItem("firstrule.token") || "";
    } catch (_) {}
  }

  function setStatus(text, ok) {
    const el = $("statusBar");
    el.textContent = text;
    el.className = ok === false ? "err" : ok === true ? "ok" : "";
  }

function appendMsg(kind, text, meta) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      div.appendChild(m);
    }
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text || "";
    div.appendChild(body);
    $("transcript").appendChild(div);
    $("transcript").scrollTop = $("transcript").scrollHeight;
    return div;
  }

  function resetStreamCards() {
    state.stream = { asst: null, think: null, tools: {} };
  }

  function ensureStreamCard(kind, meta, key) {
    if (key === "asst" && state.stream.asst) return state.stream.asst;
    if (key === "think" && state.stream.think) return state.stream.think;
    if (key && key !== "asst" && key !== "think" && state.stream.tools[key]) {
      return state.stream.tools[key];
    }
    const el = appendMsg(kind, "", meta);
    if (key === "asst") state.stream.asst = el;
    else if (key === "think") state.stream.think = el;
    else if (key) state.stream.tools[key] = el;
    return el;
  }

  function setCardBody(el, text) {
    if (!el) return;
    const body = el.querySelector(".body");
    if (body) body.textContent = text || "";
    $("transcript").scrollTop = $("transcript").scrollHeight;
  }

  function appendCardBody(el, text) {
    if (!el || !text) return;
    const body = el.querySelector(".body");
    if (body) body.textContent = (body.textContent || "") + text;
    $("transcript").scrollTop = $("transcript").scrollHeight;
  }

  function finishAssistantStreams() {
    state.stream.asst = null;
    state.stream.think = null;
  }

  function taskLabel(task) {
    if (!task) return "tool";
    const name = task.Name || task.name || "tool";
    const status = task.Status || task.status || "";
    return name + (status ? (" · " + status) : "");
  }

  function taskText(task) {
    if (!task) return "";
    const args = task.Arguments || task.arguments || "";
    const out = task.Output || task.output || task.Detail || task.detail || "";
    const parts = [];
    if (args) parts.push(args);
    if (out) parts.push(out);
    return parts.join("\n");
  }

  function handleAgentEvent(type, data) {
    switch (type) {
      case "user_message": {
        finishAssistantStreams();
        appendMsg("user", data.text || "", "user");
        break;
      }
      case "reasoning_delta": {
        if (!(data.text || "")) break;
        if (state.stream.asst) finishAssistantStreams();
        const card = ensureStreamCard("think", "thinking", "think");
        appendCardBody(card, data.text || "");
        break;
      }
      case "reasoning_end": {
        finishAssistantStreams();
        break;
      }
      case "text_delta": {
        if (state.stream.think) finishAssistantStreams();
        const card = ensureStreamCard("agent", "assistant", "asst");
        appendCardBody(card, data.text || "");
        break;
      }
      case "system_notice": {
        finishAssistantStreams();
        const id = data.noticeId || "";
        const existing = id && Array.from($("transcript").children).find(el => el.dataset.noticeId === id);
        if (existing) setCardBody(existing, data.text || "");
        else {
          const card = appendMsg("system", data.text || "", "system");
          if (id) card.dataset.noticeId = id;
        }
        break;
      }
      case "permission_request": {
        appendMsg("system", data.text || "permission requested", "permission");
        refreshPermissions().catch(() => {});
        break;
      }
      case "tool_preparing":
      case "tool_start":
      case "tool_done": {
        finishAssistantStreams();
        const task = data.task || {};
        const id = task.ID || task.id || task.PreviewID || task.previewId || ("tool-" + Date.now());
        const preview = task.PreviewID || task.previewId;
        if (preview && preview !== id && state.stream.tools[preview]) {
          state.stream.tools[id] = state.stream.tools[preview];
          delete state.stream.tools[preview];
        }
        const card = ensureStreamCard("tool", taskLabel(task), id);
        const meta = card.querySelector(".meta");
        if (meta) meta.textContent = taskLabel(task);
        setCardBody(card, taskText(task));
        if (type === "tool_done") delete state.stream.tools[id];
        break;
      }
      case "stream_done": {
        finishAssistantStreams();
        break;
      }
      case "turn_done": {
        finishAssistantStreams();
        const bits = [];
        if (data.turn) bits.push(data.turn);
        if (data.error) bits.push("error: " + data.error);
        if (data.toolTotal) bits.push("tools " + (data.toolOk || 0) + "/" + data.toolTotal);
        appendMsg("system", bits.join("\n") || "turn done", "turn_done");
        refreshSession().catch(() => {});
        break;
      }
      case "agent_error": {
        finishAssistantStreams();
        appendMsg("system", data.error || data.text || "agent error", "agent_error");
        refreshSession().catch(() => {});
        break;
      }
      default: {
        const text = data.text || data.turn || data.error || "";
        if (text) appendMsg("system", text, type || "event");
        break;
      }
    }
  }

  function apiURL(path) {
    return state.base.replace(/\/$/, "") + path;
  }

  async function api(path, opts) {
    const headers = Object.assign({ "Accept": "application/json" }, (opts && opts.headers) || {});
    const res = await fetch(apiURL(path), Object.assign({}, opts || {}, { headers }));
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
    if (!res.ok) {
      const msg = (data && data.error) || res.statusText || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data;
  }

  function showView(view) {
    state.view = view;
    $("listView").classList.toggle("active", view === "list");
    $("chatView").classList.toggle("active", view === "chat");
  }

  function shortId(id) {
    if (!id) return "?";
    return id.length > 28 ? id.slice(0, 12) + "…" + id.slice(-8) : id;
  }

  function renderSessionList() {
    const box = $("sessionList");
    box.innerHTML = "";
    if (!state.agents.length) {
      box.innerHTML = "<div style=\"color:var(--dim);padding:8px\">No running sessions. Create or attach one on the desktop daemon, then refresh.</div>";
      return;
    }
    for (const a of state.agents) {
      const el = document.createElement("div");
      el.className = "session-card" + (a.id === state.primaryId ? " primary" : "");
      el.dataset.id = a.id;
      const busy = a.busy ? " · busy" : " · idle";
      const primary = a.id === state.primaryId ? " · primary" : "";
      el.innerHTML =
        "<div class=\"title\">" + shortId(a.id) + primary + "</div>" +
        "<div class=\"meta\">" + (a.workspace || "") + "</div>" +
        "<div class=\"meta\">" + (a.model || "") + " · " + (a.mode || "") + " · " + (a.status || "") + busy + "</div>";
      el.onclick = () => openSession(a.id);
      box.appendChild(el);
    }
  }

  async function refreshAgents() {
    const data = await api("/v1/agents");
    state.agents = Array.isArray(data.agents) ? data.agents : (Array.isArray(data) ? data : []);
    state.primaryId = data.primaryId || "";
    renderSessionList();
    setStatus("sessions " + state.agents.length + (state.primaryId ? (" · primary " + shortId(state.primaryId)) : ""), true);
    return data;
  }

  async function refreshSession() {
    const s = await api("/v1/session");
    $("sessionInfo").textContent = JSON.stringify(s, null, 2);
    $("chatTitle").textContent = shortId(s.id) + (s.busy ? " · busy" : " · idle");
    setStatus("session " + (s.id || "?") + (s.busy ? " · busy" : " · idle"), true);
    return s;
  }

  async function refreshPermissions() {
    const list = await api("/v1/permissions");
    const box = $("permissions");
    box.innerHTML = "";
    if (!list || !list.length) {
      box.innerHTML = "<div style=\"color:var(--dim)\">none pending</div>";
      return;
    }
    for (const p of list) {
      const el = document.createElement("div");
      el.className = "perm";
      el.innerHTML = "<div><strong>#" + p.id + "</strong> " + (p.capability || "") +
        " <span style=\"color:var(--dim)\">" + (p.taskId || "") + "</span></div>" +
        "<div style=\"color:var(--dim);margin:4px 0\">" + (p.reason || p.detail || "") + "</div>";
      const row = document.createElement("div");
      row.className = "row";
      const approve = document.createElement("button");
      approve.textContent = "Approve";
      approve.onclick = () => decide(p.id, true);
      const deny = document.createElement("button");
      deny.className = "danger";
      deny.textContent = "Deny";
      deny.onclick = () => decide(p.id, false);
      row.appendChild(approve);
      row.appendChild(deny);
      el.appendChild(row);
      box.appendChild(el);
    }
  }

  async function decide(id, approve) {
    try {
      await api("/v1/permissions/" + id, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approve }),
      });
      await refreshPermissions();
    } catch (err) {
      appendMsg("system", String(err.message || err), "permission");
    }
  }

function connectEvents() {
    if (state.es) { try { state.es.close(); } catch (_) {} state.es = null; }
    resetStreamCards();
    const es = new EventSource(apiURL("/v1/events"));
    state.es = es;
    const on = (type) => (ev) => {
      let data = {};
      try { data = JSON.parse(ev.data || "{}"); } catch (_) { data = { text: ev.data || "" }; }
      handleAgentEvent(type, data || {});
    };
    [
      "user_message",
      "text_delta",
      "reasoning_delta",
      "reasoning_end",
      "system_notice",
      "tool_preparing",
      "tool_start",
      "tool_done",
      "stream_done",
      "turn_done",
      "agent_error",
      "permission_request",
    ].forEach((t) => {
      es.addEventListener(t, on(t));
    });
    es.onmessage = (ev) => {
      let data = {};
      try { data = JSON.parse(ev.data || "{}"); } catch (_) { data = { text: ev.data || "" }; }
      handleAgentEvent((data && data.type) || "message", data || {});
    };
    es.onerror = () => setStatus("SSE disconnected / reconnecting…", false);
  }


  function renderHistory(hist) {
    const msgs = (hist && hist.messages) || [];
    const tasks = (hist && hist.tasks) || [];
    const byID = {};
    for (const t of tasks) {
      if (t && t.id) byID[t.id] = t;
    }
    for (const m of msgs) {
      const role = (m && m.role) || "";
      if (role === "user") {
        appendMsg("user", m.text || "", "user");
      } else if (role === "assistant") {
        appendMsg("agent", m.text || "", "assistant");
      } else if (role === "thinking") {
        appendMsg("think", m.text || "", "thinking");
      } else if (role === "system") {
        const card = appendMsg("system", m.text || "", "system");
        if (m.noticeId) card.dataset.noticeId = m.noticeId;
      } else if (role === "tool_call") {
        const task = byID[m.taskId] || { id: m.taskId, name: "tool", status: "" };
        const card = appendMsg("tool", taskText(task), taskLabel(task));
        if (task.id) state.stream.tools[task.id] = card;
      }
    }
  }

async function openSession(id) {
    try {
      setStatus("opening " + shortId(id) + "…");
      if (state.es) { try { state.es.close(); } catch (_) {} state.es = null; }
$("sessionInfo").textContent = "";
      $("chatTitle").textContent = "opening…";
      $("transcript").innerHTML = "";
      resetStreamCards();
      await api("/v1/agents/" + encodeURIComponent(id) + "/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      state.selectedId = id;
      state.primaryId = id;
      showView("chat");
      const s = await refreshSession();
      if (!s || s.id !== id) {
        throw new Error("session switch mismatch: wanted " + id + " got " + ((s && s.id) || "?"));
      }
      await refreshPermissions();
      const hist = await api("/v1/history");
      if (hist && hist.id && hist.id !== id) {
        throw new Error("history session mismatch: wanted " + id + " got " + hist.id);
      }
      renderHistory(hist || { messages: [], tasks: [] });
      connectEvents();
      appendMsg("system", "Opened session " + id, "session");
    } catch (err) {
      setStatus("open failed: " + (err.message || err), false);
      showView("list");
      appendMsg("system", String(err.message || err), "open error");
    }
  }

  function backToList() {
    if (state.es) { try { state.es.close(); } catch (_) {} state.es = null; }
    state.selectedId = "";
    $("sessionInfo").textContent = "";
    $("chatTitle").textContent = "";
    $("transcript").innerHTML = "";
    showView("list");
    refreshAgents().catch((e) => setStatus(String(e.message || e), false));
  }

  async function connect() {
    $("setupError").textContent = "";
    const origin = $("relayURL").value.trim().replace(/\/$/, "");
    const token = $("token").value.trim();
    if (!origin || !token) {
      $("setupError").textContent = "relay URL and token are required";
      return;
    }
    saveCreds();
    state.base = origin + "/c/" + encodeURIComponent(token);
    try {
      setStatus("connecting…");
      await api("/healthz");
      $("setup").classList.add("hidden");
      $("app").style.display = "flex";
      $("btnDisconnect").classList.remove("hidden");
      showView("list");
      await refreshAgents();
      setStatus("connected to " + origin + " (token hidden)", true);
    } catch (err) {
      $("setupError").textContent = String(err.message || err);
      setStatus("connect failed", false);
    }
  }

  function disconnect() {
    if (state.es) { try { state.es.close(); } catch (_) {} state.es = null; }
    state.base = "";
    state.agents = [];
    state.primaryId = "";
    state.selectedId = "";
    $("app").style.display = "none";
    $("listView").classList.remove("active");
    $("chatView").classList.remove("active");
    $("setup").classList.remove("hidden");
    $("btnDisconnect").classList.add("hidden");
    setStatus("Disconnected");
  }

async function send() {
    const text = $("composer").value.trim();
    if (!text || state.busy) return;
    state.busy = true;
    $("btnSend").disabled = true;
    try {
      // Do not locally echo: user_message arrives on the shared Hub SSE,
      // same path the attached TUI uses, so both sides stay aligned.
      $("composer").value = "";
      await api("/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      await refreshSession();
    } catch (err) {
      appendMsg("system", String(err.message || err), "send error");
    } finally {
      state.busy = false;
      $("btnSend").disabled = false;
    }
  }

  $("btnConnect").onclick = connect;
  $("btnDisconnect").onclick = disconnect;
  $("btnSend").onclick = send;
  $("btnClear").onclick = () => { $("transcript").innerHTML = ""; };
  $("btnRefreshPerms").onclick = () => refreshPermissions().catch((e) => appendMsg("system", String(e.message || e), "permissions"));
  $("btnRefreshList").onclick = () => refreshAgents().catch((e) => setStatus(String(e.message || e), false));
  $("btnRefreshSession").onclick = () => refreshSession().catch((e) => appendMsg("system", String(e.message || e), "session"));
  $("btnBackList").onclick = backToList;
  $("composer").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      send();
    }
  });
  loadCreds();
})();
</script>
</body>
</html>
