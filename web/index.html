  function applyPathCompletion(path) {
    $("createWorkspace").value = path.endsWith("/") ? path : path + "/";
    closePathMenu();
    updatePathCompletions();
    $("createWorkspace").focus();
  }
  async function updatePathCompletions() {
    if (!state.base) return;
    const raw = $("createWorkspace").value || "";
    let dir = raw;
    let prefix = "";
    if (!raw.endsWith("/") && raw !== "" && raw !== "~") {
      if (raw.includes("/")) {
        const slash = raw.lastIndexOf("/");
        dir = raw.slice(0, slash + 1) || "/";
        prefix = raw.slice(slash + 1);
      } else if (raw.startsWith("~")) { dir = "~"; prefix = raw.slice(1); }
      else { dir = ""; prefix = raw; }
    }
    try {
      const data = await listDirectories(dir || "~", prefix);
      if (($("createWorkspace").value || "") !== raw) return;
      openPathMenu((data && data.directories) || []);
      if (data && data.path && !raw) $("createWorkspace").value = data.path;
      $("createHint").textContent = "Listing " + ((data && data.path) || dir || "~");
    } catch (err) {
      closePathMenu();
      $("createHint").textContent = String(err.message || err);
    }
  }
  function openCreateDialog() {
    if (!state.connected) { setHint("Connect before creating a session.", true); openSettings(); return; }
    closeSessionsDrawer();
    document.body.classList.add("create-open");
    $("createDialog").hidden = false;
    $("createHint").textContent = "Paths are sandboxed under the desktop home directory.";
    loadCreateModels().catch(() => {});
    listDirectories((($("createWorkspace").value || "~").trim()) || "~").then((data) => {
      if (data && data.home && !$("createWorkspace").value) $("createWorkspace").value = data.home + "/";
      $("createHint").textContent = "Listing " + ((data && data.path) || "~");
      return updatePathCompletions();
    }).catch((err) => { $("createHint").textContent = String(err.message || err); });
    setTimeout(() => $("createWorkspace").focus(), 0);
  }
  function closeCreateDialog() {
    document.body.classList.remove("create-open");
    $("createDialog").hidden = true;
    closePathMenu();
  }
  async function createSession() { openCreateDialog(); }
  async function confirmCreateSession() {
    const workspace = ($("createWorkspace").value || "").trim();
    if (!workspace) { $("createHint").textContent = "workspace is required"; return; }
    const model = ($("createModel").value || "").trim();
    const mode = ($("createMode").value || "off").trim() || "off";
    $("btnCreateConfirm").disabled = true;
    try {
      const body = { workspace, mode };
      if (model) body.model = model;
      const created = await api("/v1/agents", { method: "POST", body: JSON.stringify(body) });
      closeCreateDialog();
      closeEvents();
      state.historyLoadedFor = null;
      clearTranscript();
      endTurn();
      const newId = created && created.id;
      if (newId) state.primaryId = newId;
      await refreshAgents();
      if (newId) {
        await api("/v1/agents/" + encodeURIComponent(newId) + "/select", { method: "POST", body: "{}" });
        state.primaryId = newId;
        state.agents = normalizeAgents(state.agents, newId);
        renderSessions();
      }
      const bound = newId ? true : await ensurePrimarySelected();
      if (bound) openEvents();
      await Promise.all([refreshSession(), refreshPermissions()]);
      appendSystem("Created session `" + (newId || "") + "` in `" + workspace + "`");
      setHint("Session created.");
    } catch (err) {
      $("createHint").textContent = String(err.message || err);
      appendError(String(err.message || err));
    } finally {
      $("btnCreateConfirm").disabled = !state.connected;
    }
  }

  async function stopSession() {
    try {
      await api("/v1/session", { method: "POST", body: JSON.stringify({ action: "stop" }) });

      await refreshAgents();

  function autosize() {

  async function send() {
    const text = $("composer").value.trim();
    if (!text || state.busy) return;
    closePicker();
    if (text.startsWith("/")) {
      const handled = await runSlashCommand(text);
      if (handled) { $("composer").value = ""; autosize(); closeSlashMenu(); return; }
    }
    state.busy = true;
    $("btnSend").disabled = true;
    $("composer").value = "";
    autosize();
    closeSlashMenu();
    // Optimistic user bubble; SSE user_message dedupes via pendingUserText.
    state.pendingUserText = text;
    appendUser(text);
    beginTurn();
    setActivity("waiting for response");
    try {
      await api("/v1/messages", { method: "POST", body: JSON.stringify({ text }) });
      await refreshSession().catch(() => {});
    } catch (err) {
      state.pendingUserText = "";
      endTurn();
      appendError("send: " + String(err.message || err));
    } finally {
      state.busy = false;
      $("btnSend").disabled = !state.connected;
    }
  }

  /* —— Sessions drawer (mobile) —— */
  function isNarrow() { return narrowMq.matches; }
  function syncDrawerChrome() {
    const open = document.body.classList.contains("drawer-open");
    $("btnSessions").setAttribute("aria-expanded", open ? "true" : "false");
    $("btnSessions").setAttribute("aria-label", open ? "Close sessions" : "Open sessions");
    if (isNarrow()) {
      $("sidebar").setAttribute("role", "dialog");
      $("sidebar").setAttribute("aria-modal", open ? "true" : "false");
    } else {
      $("sidebar").setAttribute("role", "complementary");
      $("sidebar").removeAttribute("aria-modal");
      document.body.classList.remove("drawer-open");
      $("chat").inert = false;
    }
  }
  function openSessionsDrawer() {
    if (!isNarrow()) return;
    document.body.classList.add("drawer-open");
    $("chat").inert = true;
    syncDrawerChrome();
    $("btnCloseSessions").focus({ preventScroll: true });
  }
  function closeSessionsDrawer() {
    if (!document.body.classList.contains("drawer-open")) { syncDrawerChrome(); return; }
    document.body.classList.remove("drawer-open");
    $("chat").inert = false;
    syncDrawerChrome();
    if (isNarrow()) $("btnSessions").focus({ preventScroll: true });
  }
  function toggleSessionsDrawer() {
    if (document.body.classList.contains("drawer-open")) closeSessionsDrawer();
    else openSessionsDrawer();
  }

  /* —— Slash command menu —— */
  function parseSlash(value) {
    if (!value.startsWith("/") || value.includes("\n")) return null;
    const body = value.slice(1);
    if (body.includes(" ")) return null;
    return body.toLowerCase();
  }
  function filterSlash(prefix) {
    if (prefix == null) return [];
    return SLASH_COMMANDS.filter((c) => c.name.startsWith(prefix));
  }
  function renderSlashMenu() {
    const menu = $("slashMenu");
    const matches = state.slashMatches;
    menu.innerHTML = "";
    if (!matches.length) { menu.innerHTML = "<div class=\"slash-empty\">No matching commands</div>"; return; }
    matches.forEach((c, i) => {
      const btn = mk("button", "slash-item");
      btn.type = "button";
      btn.setAttribute("role", "option");
      btn.id = "slash-opt-" + i;
      btn.setAttribute("aria-selected", i === state.slashCursor ? "true" : "false");
      btn.appendChild(mk("span", "cmd", "/" + c.name));
      btn.appendChild(mk("span", "desc", c.description));
      btn.onmousedown = (ev) => { ev.preventDefault(); };
      btn.onclick = () => { acceptSlash(i); };
      menu.appendChild(btn);
    });
    const selected = menu.querySelector('[aria-selected="true"]');
    if (selected) selected.scrollIntoView({ block: "nearest" });
  }
  function openSlashMenu(matches) {
    state.slashMatches = matches;
    if (state.slashCursor >= matches.length) state.slashCursor = Math.max(0, matches.length - 1);
    if (state.slashCursor < 0) state.slashCursor = 0;
    renderSlashMenu();
    $("slashMenu").setAttribute("aria-hidden", "false");
    $("composer").setAttribute("aria-expanded", "true");
    const sel = $("slash-opt-" + state.slashCursor);
    if (sel) $("composer").setAttribute("aria-activedescendant", sel.id);
    else $("composer").removeAttribute("aria-activedescendant");
  }
  function closeSlashMenu() {
    state.slashMatches = [];
    state.slashCursor = 0;
    $("slashMenu").innerHTML = "";
    $("slashMenu").setAttribute("aria-hidden", "true");
    $("composer").setAttribute("aria-expanded", "false");
    $("composer").removeAttribute("aria-activedescendant");
  }
  function updateSlashFromComposer() {
    const prefix = parseSlash($("composer").value);
    if (prefix == null) { closeSlashMenu(); return; }
    const matches = filterSlash(prefix);
    if (!matches.length && prefix.length === 0) { openSlashMenu(SLASH_COMMANDS.slice()); return; }
    openSlashMenu(matches);
  }
  function acceptSlash(index) {
    const c = state.slashMatches[index];
    if (!c) return;
    $("composer").value = "/" + c.name;
    closeSlashMenu();
    $("composer").focus();
  }

  // Slash output is rendered Markdown (lists/tables), never raw JSON.
  async function runSlashCommand(raw) {
    const trimmed = raw.trim();
    const m = /^\/([\w-]+)(?:\s+([\s\S]*))?$/.exec(trimmed);
    if (!m) return false;
    const cmd = m[1].toLowerCase();
    const arg = (m[2] || "").trim();
    if (!SLASH_COMMANDS.some((c) => c.name === cmd)) return false;
    const fail = (err) => appendError(String((err && err.message) || err));
    const cell = (v) => String(v == null ? "" : v).replace(/\|/g, "\\|").replace(/\n/g, " ");

    switch (cmd) {
      case "help":
        appendSystem("Commands:\n" + SLASH_COMMANDS.map((c) => "- `/" + c.name + "`  " + c.description).join("\n"));
        return true;
      case "new":
        await createSession();
        return true;
      case "resume":
        await openResumePicker();
        return true;
      case "continue":
        try {
          await api("/v1/session", { method: "POST", body: JSON.stringify({ action: "continue" }) });
          appendSystem("Continue requested.");
          beginTurn();
        } catch (err) { fail(err); }
        return true;
      case "model": {
        try {
          if (!arg) {
            await refreshModels();
            const cur = state.session && state.session.model ? state.session.model : "(none)";
            appendSystem("Current model: `" + cur + "`\nModels:\n" + (state.models.map((x) => "- `" + x.id + "`" + (x.name ? " " + x.name : "") + (x.thinking && x.thinking.length ? " · thinking " + x.thinking.join("/") : "")).join("\n") || "- (none)"));
            openPicker("model");
          } else {
            const parts = arg.split(/\s+/);
            const payload = { action: "model", model: parts[0] };
            if (parts[1]) payload.thinking = parts[1];
            await api("/v1/session", { method: "POST", body: JSON.stringify(payload) });
            await refreshSession();
            appendSystem("Model switched to `" + parts[0] + "`" + (parts[1] ? " · thinking " + parts[1] : ""));
          }
        } catch (err) { fail(err); }
        return true;
      }
      case "thinking":
        if (arg) await applyPick("thinking", arg);
        else openPicker("thinking");
        return true;
      case "principle": {
        try {
          if (!arg) openPicker("mode");
          else {
            await api("/v1/session", { method: "POST", body: JSON.stringify({ action: "principle", mode: arg }) });
            await refreshSession();
            appendSystem("Principle mode set to `" + arg + "`");
          }
        } catch (err) { fail(err); }
        return true;
      }
      case "tasks": {
        try {
          const data = await api("/v1/tasks");
          const tasks = (data && data.tasks) || [];
          if (!tasks.length) appendSystem("No tool tasks recorded.");
          else appendSystem("| # | tool | status | time |\n|---|---|---|---|\n" + tasks.map((t, i) =>
            "| " + (i + 1) + " | " + cell(t.name || "?") + " | " + cell(t.status === "done" ? "success" : t.status) + " | " + (t.durationMs ? (t.durationMs / 1000).toFixed(1) + "s" : "") + " |").join("\n"));
        } catch (err) { fail(err); }
        return true;
      }
      case "agents": {
        try {
          const data = await api("/v1/delegates");
          const tasks = (data && data.tasks) || [];
          if (!tasks.length) appendSystem("No delegated agents.");
          else appendSystem("| task | status | model | workspace |\n|---|---|---|---|\n" + tasks.map((t) =>
            "| `" + cell(t.id) + "` | " + cell(t.status) + " | " + cell(t.model) + " | " + cell(t.workspace) + " |").join("\n"));
        } catch (err) { fail(err); }
        return true;
      }
      case "permissions":
        await refreshPermissions().catch(fail);
        if (isNarrow()) openSessionsDrawer();
        setHint("Permissions refreshed.");
        return true;
      case "approve":
      case "deny": {
        if (!arg) { appendSystem("usage: `/" + cmd + " REQUEST_ID`"); return true; }
        try {
          await api("/v1/permissions/" + encodeURIComponent(arg), { method: "POST", body: JSON.stringify({ approve: cmd === "approve" }) });
          await refreshPermissions();
          appendSystem((cmd === "approve" ? "Approved" : "Denied") + " permission #" + arg);
        } catch (err) { fail(err); }
        return true;
      }
      case "revoke": {
        const parts = arg.split(/\s+/).filter(Boolean);
        if (parts.length !== 2) { appendSystem("usage: `/revoke TASK CAPABILITY`"); return true; }
        try {
          await api("/v1/delegates", { method: "POST", body: JSON.stringify({ action: "revoke", taskId: parts[0], capability: parts[1] }) });
          appendSystem("Revoked `" + parts[1] + "` from `" + parts[0] + "`");
        } catch (err) { fail(err); }
        return true;
      }
      case "settings": {
        try {
          if (!arg) {
            const data = await api("/v1/session", { method: "POST", body: JSON.stringify({ action: "settings" }) });
            appendSystem("Session settings: compaction threshold " + data.compactionThreshold + ", delegate parallel " + data.parallel + "\n(parallel=" + data.parallel + ")");
          } else {
            const parts = arg.split(/\s+/);
            const key = parts[0];
            const val = parts[1];
            const payload = { action: "settings" };
            if (key === "delegate-parallel" || key === "parallel") payload.parallel = Number(val);
            else if (key === "compaction-threshold" || key === "compactionThreshold") payload.compactionThreshold = Number(val);
            else { appendSystem("usage: `/settings [delegate-parallel N|compaction-threshold R]`"); return true; }
            const data = await api("/v1/session", { method: "POST", body: JSON.stringify(payload) });
            appendSystem("Settings updated: " + Object.keys(data || {}).filter((k) => k !== "ok" && k !== "action").map((k) => k + " " + data[k]).join(", "));
          }
        } catch (err) { fail(err); }
        return true;
      }
      case "compact":
        try {
          const data = await api("/v1/session", { method: "POST", body: JSON.stringify({ action: "compact" }) });
          appendSystem((data && data.message) || "Compaction requested");
        } catch (err) { fail(err); }
        return true;
      case "status": {
        const s = state.session;
        const wf = s && s.workflow;
        appendSystem([
          "- connection: " + (state.connected ? "live" : "offline"),
          "- relay: " + ($("relayURL").value.trim() || "(none)"),
          "- session: `" + (s && s.id ? s.id : "(none)") + "`",
          "- workspace: `" + (s && s.workspace ? s.workspace : "n/a") + "`",
          "- state: " + (s && (s.state || s.status) ? (s.state || s.status) : "n/a") + (s && s.busy ? " (busy)" : ""),
          "- model: " + (s && s.model ? s.model : "n/a") + " · thinking " + (s && s.thinking ? s.thinking : "default"),
          "- workflow: " + (s && s.mode ? s.mode : "n/a") + (wf ? " · " + (wf.complete ? "complete" : "phase: " + wf.current) : ""),
          "- sessions: " + state.agents.length,
        ].join("\n"));
        return true;
      }
      case "pwd": {
        const s = state.session;
        appendSystem("workspace: `" + ((s && s.workspace) || "(none)") + "`  (session `" + ((s && s.id) || "none") + "`)");
        return true;
      }
      case "stop":
        await stopSession();
        return true;
      default:
        return false;
    }
  }

  /* —— Wiring —— */
  $("btnConnect").onclick = connect;
  $("btnDisconnect").onclick = disconnect;
  $("btnSettings").onclick = openSettings;
  $("btnSettingsClose").onclick = closeSettings;
  $("settingsDialog").addEventListener("click", (ev) => { if (ev.target === $("settingsDialog")) closeSettings(); });
  $("btnSend").onclick = send;
  $("btnStopTurn").onclick = () => runSlashCommand("/stop");
  $("btnNew").onclick = createSession;
  $("btnCreateCancel").onclick = closeCreateDialog;
  $("btnCreateConfirm").onclick = confirmCreateSession;
  $("createWorkspace").addEventListener("input", () => { updatePathCompletions().catch(() => {}); });
  $("createWorkspace").addEventListener("keydown", (ev) => {
    const open = $("pathMenu").classList.contains("open");
    if (!open) { if (ev.key === "Escape") closeCreateDialog(); return; }
    if (ev.key === "ArrowDown") { ev.preventDefault(); state.pathCursor = Math.min(state.pathCursor + 1, state.pathMatches.length - 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); state.pathCursor = Math.max(state.pathCursor - 1, 0); }
    else if (ev.key === "Enter" && state.pathMatches[state.pathCursor]) { ev.preventDefault(); applyPathCompletion(state.pathMatches[state.pathCursor].path); return; }
    else if (ev.key === "Escape") { ev.preventDefault(); closePathMenu(); return; }
    else return;
    [...$("pathMenu").children].forEach((el, i) => el.setAttribute("aria-selected", i === state.pathCursor ? "true" : "false"));
  });
  $("createDialog").addEventListener("click", (ev) => { if (ev.target === $("createDialog")) closeCreateDialog(); });

  $("btnStop").onclick = stopSession;
  $("btnRefresh").onclick = () => {
    refreshAgents()
      .then(() => ensurePrimarySelected())
      .then((bound) => {
        if (bound) openEvents();
        return Promise.all([refreshModels(), refreshSession(), refreshPermissions()]);
      })
      .catch(appendErrorFromPromise);
  };
  function appendErrorFromPromise(e) { appendError(String((e && e.message) || e)); }
  $("btnRefreshAgents").onclick = () => {
    refreshAgents()
      .then(() => ensurePrimarySelected())
      .then((bound) => {
        if (bound) openEvents();
        return refreshSession();
      })
      .catch(appendErrorFromPromise);
  };
  $("btnRefreshPerms").onclick = () => refreshPermissions().catch(appendErrorFromPromise);
  $("btnSessions").onclick = toggleSessionsDrawer;
  $("btnCloseSessions").onclick = closeSessionsDrawer;
  $("drawerBackdrop").onclick = closeSessionsDrawer;
  $("chipModel").onclick = () => openPicker("model");
  $("chipThinking").onclick = () => openPicker("thinking");
  $("chipMode").onclick = () => openPicker("mode");

  transcript().addEventListener("scroll", onTranscriptScroll, { passive: true });
  $("composer").addEventListener("input", () => { autosize(); updateSlashFromComposer(); });
  $("composer").addEventListener("keydown", (ev) => {
    const menuOpen = $("slashMenu").getAttribute("aria-hidden") === "false";
    if (menuOpen && state.slashMatches.length) {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        const d = ev.key === "ArrowDown" ? 1 : -1;
        state.slashCursor = (state.slashCursor + d + state.slashMatches.length) % state.slashMatches.length;
        renderSlashMenu();
        $("composer").setAttribute("aria-activedescendant", "slash-opt-" + state.slashCursor);
        return;
      }
      if (ev.key === "Tab") { ev.preventDefault(); acceptSlash(state.slashCursor); return; }
      if (ev.key === "Escape") { ev.preventDefault(); closeSlashMenu(); return; }
      if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
        ev.preventDefault();
        const c = state.slashMatches[state.slashCursor];
        if (c) $("composer").value = "/" + c.name;
        closeSlashMenu();
        send();
        return;
      }
    } else if (ev.key === "Escape") {
      closePicker();
      if (document.body.classList.contains("drawer-open")) { ev.preventDefault(); closeSessionsDrawer(); return; }
    }
    // Enter keeps its newline role for long text; ⌘/Ctrl+Enter sends.
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (!$("settingsDialog").hidden) { closeSettings(); return; }
    if (document.body.classList.contains("drawer-open")) { ev.preventDefault(); closeSessionsDrawer(); }
  });
  document.addEventListener("click", (ev) => {
    const p = $("picker");
    if (p.hidden || !ev.target || !ev.target.closest) return;
    if (!ev.target.closest("#picker") && !ev.target.closest(".chip") && !ev.target.closest("#composer")) closePicker();
  });

  function onViewportChange() {
    if (!isNarrow()) closeSessionsDrawer();
    else syncDrawerChrome();
  }
  if (typeof narrowMq.addEventListener === "function") narrowMq.addEventListener("change", onViewportChange);
  else if (typeof narrowMq.addListener === "function") narrowMq.addListener(onViewportChange);

  const savedURL = localStorage.getItem(LS.url) || "";
  $("relayURL").value = savedURL || $("relayURL").value || defaultRelayOrigin();
  const savedToken = localStorage.getItem(LS.token);
  if (savedToken) $("token").value = savedToken;
  $("autoConnect").checked = localStorage.getItem(LS.auto) !== "";
  $("relayURL").addEventListener("change", () => {
    const origin = normalizeRelayOrigin($("relayURL").value);
    if (origin) $("relayURL").value = origin;
    saveSettings();
  });
  $("token").addEventListener("change", saveSettings);
  $("autoConnect").addEventListener("change", saveSettings);

  // Keyboard: size the app to the visual viewport so the top bar stays put
  // and only the transcript shrinks; undo iOS's page shift on focus.
  function syncViewport() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    const root = document.documentElement;
    if (!root || !h) return;
    root.style.setProperty("--vvh", Math.round(h) + "px");
    if (window.scrollY || root.scrollTop) window.scrollTo(0, 0);
    if (follow) stickBottom(false);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", syncViewport);
    visualViewport.addEventListener("scroll", syncViewport);
  }
  if (typeof window.addEventListener === "function") window.addEventListener("resize", syncViewport);
  $("composer").addEventListener("focus", () => setTimeout(syncViewport, 50));
  syncViewport();

  setConnected(false);
  syncDrawerChrome();
  setStatus(null, "offline");
  updateSessionLabel();
  if (savedToken && $("autoConnect").checked) connect();
  else if (!savedToken) { setHint("Open ⚙ settings to connect."); openSettings(); }
  else setHint("Ready. Open ⚙ settings and Connect.");
})();
</script>
</body>
</html>
